# Runs on every push to main and every PR targeting main.
# Builds ONLY the production frontend directory (omniverseos-source/frontend/)
# — the same directory Vercel uses. frontend/ is a partial mirror and is ignored.
#
# Steps (in order):
#   1. Install dependencies
#   2. ESLint + Production build  (CI=true makes CRA treat lint warnings as errors)
#   3. Tests

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint · Build · Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: omniverseos-source/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: omniverseos-source/frontend/package-lock.json

      # ── 1. Install ────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── 2. ESLint + Production build ──────────────────────────────────────
      # CI=true causes react-scripts (via craco) to:
      #   • treat ESLint warnings as hard errors
      #   • produce an optimised production bundle
      - name: ESLint + Production build
        run: npm run build
        env:
          CI: "true"

      # ── 3. Tests (already exist in src/__tests__/) ────────────────────────
      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests --forceExit
        env:
          CI: "true"
